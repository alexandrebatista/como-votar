name: Release

# One GitHub Release (tag vX.Y.Z + notes generated by GitHub) per PR merged into main.
# Versioning only: it deploys nothing.
#
# The bump comes from the merged PR's title (Conventional Commits types):
#   feat!: / any type with "!" / "BREAKING CHANGE" in the body -> major
#   feat:                                                        -> minor
#   fix:, refactor:, perf:, revert:, or no recognized type        -> patch
#   docs:, test:, chore:, ci:, style:, build:                    -> no release
# A label on the PR overrides the title: release:major, release:minor, release:patch,
# skip-release. Going to 1.0.0 is a manual decision:
#   gh release create v1.0.0 --target main --generate-notes
#
# Installed from ~/.claude/templates/release.yml by ~/.claude/bin/setup-release.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

# Versions are computed from the latest tag, so runs go one at a time. GitHub keeps only
# one pending run per group, so a run may be dropped when merges come fast; each run
# therefore covers every PR merged since the latest tag (the largest bump wins).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only after the tests passed for a push to main of this repository (never tag a
    # commit that failed them, nor a PR run whose branch happens to be called main).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Decide the release
        id: decide
        run: |
          # Errors inside $(...) must stop the run, not silently turn into a patch release.
          shopt -s inherit_errexit 2>/dev/null || true  # bash >= 4.4 (GitHub runners)
          # >>> bump
          # bump TITLE LABELS(comma-separated) BODY -> major | minor | patch | none
          bump() {
            local title="$1" labels=",$2," body="$3" type
            case "$labels" in
              *,skip-release,*) echo none; return ;;
              *,release:major,*) echo major; return ;;
              *,release:minor,*) echo minor; return ;;
              *,release:patch,*) echo patch; return ;;
            esac
            if printf '%s' "$body" | grep -q 'BREAKING CHANGE'; then echo major; return; fi
            type=$(printf '%s' "$title" | sed -nE 's/^([A-Za-z]+)(\([^)]*\))?(!?):.*/\1\3/p' | tr 'A-Z' 'a-z')
            case "$type" in
              *!) echo major ;;
              feat) echo minor ;;
              docs|test|tests|chore|ci|style|build) echo none ;;
              *) echo patch ;;
            esac
          }
          # <<< bump

          # pr_bump SHA -> bump of the merged PR behind that commit (patch when none)
          pr_bump() {
            local pr title labels body
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$1/pulls" \
                   --jq '[.[] | select(.merged_at != null)] | first // empty')
            if [ -z "$pr" ]; then echo patch; return; fi
            title=$(printf '%s' "$pr" | jq -r '.title')
            labels=$(printf '%s' "$pr" | jq -r '[.labels[].name] | join(",")')
            body=$(printf '%s' "$pr" | jq -r '.body // ""')
            echo "PR #$(printf '%s' "$pr" | jq -r '.number'): $title [$labels]" >&2
            bump "$title" "$labels" "$body"
          }
          rank() { case "$1" in major) echo 3 ;; minor) echo 2 ;; patch) echo 1 ;; *) echo 0 ;; esac; }

          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          # Every PR merged since the latest release (merge commits on main), or just this one.
          if [ -n "$latest" ]; then
            shas=$(git log --first-parent --merges --format=%H "$latest..$SHA" | head -n 50)
          fi
          [ -n "${shas:-}" ] || shas="$SHA"
          kind=none
          for s in $shas; do
            k=$(pr_bump "$s")
            if [ "$(rank "$k")" -gt "$(rank "$kind")" ]; then kind=$k; fi
          done

          # Already covered: tagged itself, or contained in the latest release (a later run
          # got there first).
          if [ -n "$latest" ] && git merge-base --is-ancestor "$SHA" "$latest"; then
            echo "Commit already included in $latest; nothing to do."
            kind=none
          fi

          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$kind" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v$major.$((minor + 1)).0" ;;
            patch) next="v$major.$minor.$((patch + 1))" ;;
            *) next="" ;;
          esac
          echo "kind=$kind previous=${latest:-none} next=${next:-none}"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: steps.decide.outputs.next != ''
        env:
          NEXT: ${{ steps.decide.outputs.next }}
          PREVIOUS: ${{ steps.decide.outputs.previous }}
        run: |
          args=(--target "$SHA" --title "$NEXT" --generate-notes)
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$NEXT" "${args[@]}"
          echo "Released $NEXT" >> "$GITHUB_STEP_SUMMARY"
